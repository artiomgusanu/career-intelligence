services:
  db:
    image: postgres:17
    container_name: career-intelligence-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: career_intelligence
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d career_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: